name: Tashiro MIA conservative nested heldout TPR010 selection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tashiro-mia-nested-safe-010-20261009.yml'
permissions:
  contents: write
jobs:
  run_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXP: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_TPR010到達と加工特徴転移検証'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install analysis dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Test strict nested non-leakage
        run: python -m unittest discover -s "$EXP" -p test_nested_holdout.py -v
      - name: Evaluate nested selection with safety budgets
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/run_nested_safe.py" --root . --out "$RUNNER_TEMP/mia-safe-nested"
      - name: Validate holdout shape, number of baselines and policy gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mia-safe-nested'
          a=pd.read_csv(p/'safe_nested_by_target.csv')
          s=pd.read_csv(p/'safe_nested_summary.csv')
          j=json.loads((p/'protocol.json').read_text())
          assert len(a)==34 and len(s)==2
          assert sorted(s.safety_budget.tolist())==[0,1]
          assert a.team.nunique()==17
          assert (a.new_ge010*a.lost_ge010==0).all()
          assert j['score_panel_already_tuned_on_preliminary_labels']
          assert not j['main_submission']
          print('PASS: conservative 17-target outer validation, 2 predeclared safety budgets')
          print(s.to_string(index=False))
          PY
      - name: Publish only cohort-level metrics
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/mia-safe-nested"
          mkdir -p "$EXP/nested_safety"
          for f in safe_nested_by_target.csv safe_nested_summary.csv protocol.json; do
            test -s "$SRC/$f"
            cp "$SRC/$f" "$EXP/nested_safety/$f"
          done
          (cd "$EXP/nested_safety" && sha256sum safe_nested_by_target.csv safe_nested_summary.csv protocol.json > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/nested_safety"
          git diff --cached --quiet && exit 0
          git commit -m 'MIA全体：既存0.10達成を守る二重チーム保留と感度結果を保存'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
