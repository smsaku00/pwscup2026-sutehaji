name: Tashiro PWS prelim official public score workbook audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tashiro-prelim-public-score-audit-20261009.yml']
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read public preliminary official workbook with Python stdlib
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile,xml.etree.ElementTree as ET,json,re
          file=Path('公式データ/予備戦/結果/公開用結果表_20260909.xlsx')
          assert file.exists(), file
          NS='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          RR='{http://schemas.openxmlformats.org/officeDocument/2006/relationships}'
          RP='{http://schemas.openxmlformats.org/package/2006/relationships}'
          with zipfile.ZipFile(file) as z:
            files=set(z.namelist())
            w=ET.fromstring(z.read('xl/workbook.xml'))
            rel=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
            mapping={x.get('Id'):x.get('Target') for x in rel.findall(RP+'Relationship')}
            strings=[]
            if 'xl/sharedStrings.xml' in files:
              ss=ET.fromstring(z.read('xl/sharedStrings.xml'))
              strings=[''.join(s.itertext()) for s in ss.findall(NS+'si')]
            def vcell(c):
              typ=c.get('t')
              if typ=='inlineStr':
                el=c.find(NS+'is')
                return ''.join(el.itertext()) if el is not None else ''
              val=c.find(NS+'v')
              if val is None:return ''
              s=val.text or ''
              if typ=='s':return strings[int(s)]
              if typ in ('str','e','b'):return s
              try:return float(s)
              except:return s
            for node in w.findall('.//'+NS+'sheet'):
              name=node.get('name')
              target=mapping[node.get(RR+'id')]
              sheet_path=target.lstrip('/') if target.startswith('/') else 'xl/'+target
              if not sheet_path.startswith('xl/'):sheet_path='xl/'+sheet_path
              sheet_path=re.sub(r'^xl/xl/', 'xl/',sheet_path)
              root=ET.fromstring(z.read(sheet_path))
              allrows=[]
              for row in root.findall('.//'+NS+'sheetData/'+NS+'row'):
                populated=[]
                for c in row.findall(NS+'c'):
                  val=vcell(c)
                  if val!='':
                    populated.append([c.get('r'),val])
                if populated: allrows.append(populated)
              print('SHEET_SUMMARY_JSON='+json.dumps({
                'sheet':name,'total_populated_rows':len(allrows),
                'preview':[[[coord,(str(val)[:110] if isinstance(val,str) else val)]
                            for coord,val in cells[:28]]
                            for cells in allrows[:24]]
              },ensure_ascii=False))
              # Explicit aggregate-only extraction, retaining the workbook's cached numeric values.
              def rowdict(row):
                return {re.match(r'([A-Z]+)',k).group(1):v for k,v in row}
              if name=='総括':
                scoreboards=[]
                for line in allrows[1:]:
                  obj=rowdict(line)
                  if 'P' not in obj:continue
                  scoreboards.append({
                    'cohort':int(obj['A']),'team':obj.get('B'),
                    'attack':obj.get('P'),'rank':obj.get('Q'),
                    'overall_standing':obj.get('O'),
                    'U':obj.get('C')})
                print('OFFICIAL_PRELIM_ATTACK_RANKING_JSON='+json.dumps(
                  sorted(scoreboards,key=lambda v:v['attack'],reverse=True),ensure_ascii=False))
              if name=='攻撃_標的別_MIA':
                dataset=[rowdict(r) for r in allrows[1:]]
                mine=[]
                agg={}
                for r in dataset:
                  attacker=int(r['A']);target=int(r['B'])
                  g=float(r['G']);tpr=float(r['E'])
                  item={'target':target,'tpr_all':tpr,
                        'tpr_rare':r.get('F'),'t_j_max':g,
                        'member_count':r.get('C'),'rare_count':r.get('D')}
                  agg.setdefault(attacker,[]).append(item)
                  if attacker==5:mine.append(item)
                byattacker=[{
                  'cohort':attacker,'target_count':len(vals),
                  'mia_all_mean':sum(x['tpr_all'] for x in vals)/len(vals),
                  'mia_max_mean':sum(x['t_j_max'] for x in vals)/len(vals),
                  'tpr_ge_010':sum(x['tpr_all']>=.1-1e-12 for x in vals)
                } for attacker,vals in agg.items()]
                print('OFFICIAL_PRELIM_OUR_MIA_PER_TARGET_JSON='+json.dumps(
                  sorted(mine,key=lambda x:x['target']),ensure_ascii=False))
                print('OFFICIAL_PRELIM_ALL_ATTACKERS_MIA_JSON='+json.dumps(
                  sorted(byattacker,key=lambda x:x['mia_all_mean'],reverse=True),ensure_ascii=False))
              if name=='攻撃_標的別_AIA':
                dataset=[rowdict(r) for r in allrows[1:]]
                mine=[{'target':int(r['B']),'AIA_all':r.get('C'),
                       'AIA_rare':r.get('D'),'AIA_max':r.get('J')}
                      for r in dataset if int(r['A'])==5]
                print('OFFICIAL_PRELIM_OUR_AIA_PER_TARGET_JSON='+json.dumps(
                  sorted(mine,key=lambda x:x['target']),ensure_ascii=False))
          PY
