name: Tashiro MIA exact archived KDE-A formula regression and P01 fusion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tashiro-mia-archived-kdeA-mix-010-20261009.yml'
permissions:
  contents: write
jobs:
  verify_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      EXP: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_TPR010到達と加工特徴転移検証'
      BASE: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_全対象共同推定'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_全対象共同推定/requirements.txt'
      - name: Install dependencies pinned from P01
        run: python -m pip install -r "$BASE/requirements.txt"
      - name: Test original categorical KDE identity and marginal alignment
        run: python -m unittest discover -s "$EXP" -p test_archived_kdeA_mix.py -v
      - name: Recreate original q13 KDE-A and check archived full score then compare P01 mixtures
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/run_archived_kdeA_mix.py" --root . --output-dir "$RUNNER_TEMP/mia-exact-kde"
      - name: Assert exact archived regression and frozen score provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pandas as pd
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mia-exact-kde'
          x=json.loads((p/'archived_KDEA_regression.json').read_text())
          prot=json.loads((p/'protocol.json').read_text())
          s=pd.read_csv(p/'summary.csv')
          b=pd.read_csv(p/'by_target.csv')
          assert x['targets']==17 and x['max_abs_error']<1e-10
          assert len(b)==760 and s.inference.nunique()==2 and s.background.nunique()==4
          assert s.method.nunique()==5 and set(prot['mix_weights'])=={0,0.25,0.5,0.75,1.}
          assert not prot['main_submission'] and prot['rare_5bit_unmodified']
          print('PASS: archived KDE A full score regression, both target scopes, 5 fixed weights')
          print(s[(s.background=='full')&(s.evaluation=='without1_2')][
             ['inference','method','mean_tpr','full_reached_010','new_reached_010','lost_reached_010','wins','losses']].to_string(index=False))
          PY
      - name: Publish aggregate preliminary results only
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mia-exact-kde"
          mkdir -p "$EXP/archived_kdeA_mix_4bg"
          for n in by_target.csv summary.csv threshold_stability.csv prediction_hashes.json archived_KDEA_regression.json protocol.json; do
            test -s "$src/$n"
            cp "$src/$n" "$EXP/archived_kdeA_mix_4bg/$n"
          done
          (cd "$EXP/archived_kdeA_mix_4bg" && sha256sum by_target.csv summary.csv threshold_stability.csv prediction_hashes.json archived_KDEA_regression.json protocol.json > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/archived_kdeA_mix_4bg"
          git diff --cached --quiet && exit 0
          git commit -m 'MIA全体：旧KDE Aの数値再現とP01混合を予備戦で検証'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo 'Unable to push the aggregate results after six attempts' >&2
          exit 1

# Four backgrounds; preserve the previous full-only outputs under a separate directory.

# Retry-safe archival run: keep earlier full-only and other aggregate commits intact.
