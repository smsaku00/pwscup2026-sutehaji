name: Restore approved AIA rare experiment snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aia-rare-restore-20261009.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and restore exactly the approved snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import io, tarfile, hashlib, json, shutil
          source=Path('攻撃フェーズ/Tashiro/AIA希少/experiments/.20261009_pair_transfer')
          target=Path('攻撃フェーズ/Tashiro/AIA希少/experiments/20261009_高信頼ペアと棄権値')
          data=b''.join((source/f'part-{i:02}').read_bytes() for i in range(9))
          assert hashlib.sha256(data).hexdigest()=='bf688d4d7340fab474c7aa0eef346fac2d70baa01052f3d2091736a993d81b86'
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as tf:
              entries=tf.getmembers()
              assert len(entries)==29 and all(m.isfile() for m in entries)
              files={}
              for m in entries:
                  p=PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.name not in {'B.csv','B_self.csv','token.txt','F_aia.csv','F_mia.csv'}
                  files[m.name]=tf.extractfile(m).read()
              manifest=json.loads(files['SHA256SUMS.json'])
              assert set(files)==set(manifest)|{'SHA256SUMS.json'}
              for name,digest in manifest.items():
                  assert hashlib.sha256(files[name]).hexdigest()==digest, name
              for name,content in files.items():
                  dest=target/name
                  if dest.exists() and dest.read_bytes()!=content:
                      raise RuntimeError('Refusing to overwrite different existing file: '+str(dest))
              for name,content in files.items():
                  dest=target/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(content)
          (target/'掲載記録.md').write_text('# 掲載記録\n\n2026年10月9日、利用者の依頼により、会話で作成した29ファイルをSHA256照合のうえ原文のままGitHubへ掲載しました。\n\nREADME.md・STATUS.json・実行記録の「GitHub未反映」「公式再実行は未完了」は、その保存成果物を作成した時点の履歴です。本ファイルはそれらの実測結果を変更しません。\n\n今回の模擬検証を公式予備戦の実測と読み替えないでください。AIA全体の公式予備戦による追加検証は、AIA全体/experiments/20261009_高信頼ペアと棄権値/に別途掲載します。\n\n入力B・B_self・秘密トークン・大会提出CSVは追加していません。\n',encoding='utf-8')
          shutil.rmtree(source)
          print('Verified and restored 29 original files; publication note added.')
          PY
      - name: Commit only the requested experiment files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '攻撃フェーズ/Tashiro/AIA希少/experiments/20261009_高信頼ペアと棄権値'
          git add -u -- '攻撃フェーズ/Tashiro/AIA希少/experiments/.20261009_pair_transfer'
          git commit -m 'AIA希少の高信頼ペア候補・棄権値の模擬検証29ファイルを原本照合して掲載'
          git pull --rebase origin main
          git push origin HEAD:main
