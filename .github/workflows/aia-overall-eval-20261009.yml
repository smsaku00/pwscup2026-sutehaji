name: AIA overall fixed preliminary experiment 20261009
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aia-overall-eval-20261009.yml']
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install the same fixed versions as local verification
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Re-run the overall experiment and verify local equivalence
        shell: bash
        run: |
          BASE='攻撃フェーズ/Tashiro/AIA全体/experiments/20261009_高信頼ペアと棄権値'
          test ! -e "$BASE/results/run_manifest.json"
          python "$BASE/all_experiment.py" --root . --out "$BASE/results" > "$BASE/execution.log" 2>&1
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, hashlib, json
          p=Path('攻撃フェーズ/Tashiro/AIA全体/experiments/20261009_高信頼ペアと棄権値')
          assert hashlib.sha256((p/'all_experiment.py').read_bytes()).hexdigest()=='17778123c9aac26db53f9558c3037dcecaf0ee3a517ae9015caa1b978a190b87'
          d=pd.read_csv(p/'results/case_metrics.csv')
          semantic=d.round(10).to_csv(index=False,float_format='%.10f')
          digest=hashlib.sha256(semantic.encode()).hexdigest()
          assert digest=='423aef890b807825e532d131c585194c2519afb1d59a309554033aaa584983cd', digest
          manifest=json.loads((p/'results/run_manifest.json').read_text())
          for name,expected in manifest['input_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected, name
          record={'local_vs_github_actions_metrics_equal_to_10_decimal_places':True,'metric_rows':len(d),'local_semantic_sha256':digest,'input_files_verified':len(manifest['input_sha256']),'contest_submitted':False,'verification_note':'Separate local run also reproduced all seven result CSVs byte-for-byte; shared scorer verified in local archive.'}
          (p/'actions_verification.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(record,ensure_ascii=False))
          PY
      - name: Commit only experiment outputs, not inputs or submissions
        shell: bash
        run: |
          BASE='攻撃フェーズ/Tashiro/AIA全体/experiments/20261009_高信頼ペアと棄権値'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$BASE/results" "$BASE/execution.log" "$BASE/actions_verification.json"
          git commit -m 'AIA全体の公式予備戦21対象・公開ペア修正と0年11年比較の実測を掲載'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: aia-overall-results-20261009
          path: 攻撃フェーズ/Tashiro/AIA全体/experiments/20261009_高信頼ペアと棄権値/
          retention-days: 1
          if-no-files-found: error
