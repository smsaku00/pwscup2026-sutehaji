name: Tashiro AIA pair fixed audit
on:
  push:
    branches: ['tashiro/aia-pair-audit-20261009']
    paths: ['.github/workflows/tashiro-aia-pair-audit.yml']
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXP: 攻撃フェーズ/Tashiro/AIA希少/experiments/20261009_高信頼ペア限定
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tashiro/aia-pair-audit-20261009
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install fixed dependencies
        run: python -m pip install -r "$EXP/requirements.txt"
      - name: Run fixed experiment and independent checks
        run: |
          python "$EXP/analyze.py" --repo "$GITHUB_WORKSPACE"
          python "$EXP/verify.py" --repo "$GITHUB_WORKSPACE"
      - name: Commit only the new experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$EXP/results"
          if ! git diff --cached --quiet; then
            git commit -m '高信頼AIAペア限定実験の全結果と独立検算を保存'
            git push origin HEAD:tashiro/aia-pair-audit-20261009
          fi
      - name: Package reproducible outputs
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          root=Path(os.environ['EXP'])
          with zipfile.ZipFile('/tmp/aia-pair-results.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts:
                      z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aia-pair-fixed-results
          path: /tmp/aia-pair-results.zip
          retention-days: 7
