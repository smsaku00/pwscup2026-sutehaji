name: Tashiro MIA 0.10 fixed22 AIA-imprint high-group posthoc (one-off)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tashiro-mia-tpr010-archived-high-group-20261009.yml'
permissions:
  contents: write
jobs:
  run_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXP: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_TPR010到達と加工特徴転移検証'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install analysis dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Screen fixed22 archived methods across public AIA high group
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/screen_archived_high_group.py" --root . --out "$RUNNER_TEMP/mia-010-archived-high"
      - name: Validate 17-target threshold coverage and selection boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,pandas as pd
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'mia-010-archived-high'
          a=pd.read_csv(p/'all_22_high_group_methods.csv')
          b=pd.read_csv(p/'all_22_high_group_targets.csv')
          c=json.loads((p/'protocol.json').read_text())
          assert len(a)==22 and len(b)==17*22
          assert b.team.nunique()==17 and a.method_for_high_group.nunique()==22
          assert (a.full_hit_ge010<=17).all()
          assert (a.all7_hit_ge010<=a.full_hit_ge010).all()
          assert c['method_selection_after_results'] and not c['main_submission_not_changed'] is False
          assert a[a.method_for_high_group=='Q_prefecture_sex_shrink500_cross01'].full_hit_ge010.item()==2
          print('PASS: 22 public high-group candidate rules, full TPR.10 and all7 audit')
          print(a.sort_values(['all7_hit_ge010','full_hit_ge010'],ascending=False).head(15).to_string(index=False))
          PY
      - name: Publish aggregate group screen
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/mia-010-archived-high"
          mkdir -p "$EXP/archived_high_group"
          for f in all_22_high_group_methods.csv all_22_high_group_targets.csv protocol.json; do
            test -s "$SRC/$f"
            cp "$SRC/$f" "$EXP/archived_high_group/$f"
          done
          (cd "$EXP/archived_high_group" && sha256sum all_22_high_group_methods.csv all_22_high_group_targets.csv protocol.json > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/archived_high_group"
          git diff --cached --quiet && exit 0
          git commit -m 'MIA全体：AIA imprint高群の固定22方式TPR0.10到達を事後集計'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
