name: Tashiro MIA P08 public-copy residual P04 integration and target-holdout audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tashiro-mia-p08-p04-overlay-prelim-20261009.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      EXP: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_P08_公開残差と時刻条件付'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install aggregate-only analysis dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 openpyxl==3.1.5
      - name: Score P04 with P08 public-copy filter and heldout policy-choice sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/audit_p04_overlay.py" --root . --out "$RUNNER_TEMP/p08-overlay"
      - name: Check P04 historical score and public majority-copy gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          import pandas as pd
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'p08-overlay'
          a=pd.read_csv(p/'overlay_counterfactual.csv')
          b=pd.read_csv(p/'overlay_by_target.csv')
          l=pd.read_csv(p/'LOOTO_threshold_choice.csv')
          r=json.loads((p/'LOOTO_summary.json').read_text())
          assert len(a)==4 and len(b)==17*4 and len(l)==17
          assert abs(a[a.policy=='P04'].hypothetical_prelim_attack.item()-.34919703643719757)<1e-12
          assert abs(a[a.policy=='P08_A_majority50'].hypothetical_prelim_attack.item()-.35312011336027455)<1e-12
          assert a[a.policy=='P08_A_majority50'].would_beat_official_3rd.item()==1
          assert r['historical_success_target_selection_bias']
          assert r['actual_main_TPR_unobserved'] and r['no_main_submission']
          assert len(r['LOOTO_heldout_improved_teams'])<=2
          print('PASS: target-independent public-copy share rule, 4 predefined cutoffs, 17 outer heldout evaluations')
          print(a.to_string(index=False))
          print(json.dumps({k:r[k] for k in ['LOOTO_counterfactual_attack','LOOTO_improvement_over_P04','LOOTO_gap_third','LOOTO_heldout_improved_teams']},indent=2))
          PY
      - name: Publish aggregate P04 overlay and target-holdout tables only
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/p08-overlay"
          mkdir -p "$EXP/overlay"
          for n in overlay_counterfactual.csv overlay_by_target.csv LOOTO_threshold_choice.csv LOOTO_summary.json; do
            test -s "$src/$n"
            cp "$src/$n" "$EXP/overlay/$n"
          done
          (cd "$EXP/overlay" && sha256sum overlay_counterfactual.csv overlay_by_target.csv LOOTO_threshold_choice.csv LOOTO_summary.json > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/overlay"
          git diff --cached --quiet && exit 0
          git commit -m 'MIA全体：P08公開コピー残差とP04統合の仮想得点・LOOTOを保存'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
