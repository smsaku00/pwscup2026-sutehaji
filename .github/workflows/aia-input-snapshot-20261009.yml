name: AIA official input snapshot (one-off 20261009)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aia-input-snapshot-20261009.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect only official public preliminary inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, hashlib, json
          base=Path('公式データ/予備戦')
          out=Path('aia-official-input-snapshot')
          paths=[]
          for directory, pattern in [('PWSCup2026_prelim_attack','*.csv'),('PWSCup2026_prelim_common','A_bg.csv'),('結果/正解データ','aia_truth_*.csv')]:
              paths.extend(sorted((base/directory).glob(pattern)))
          paths += [base/'PWSCup2026_prelim_common/schema.json']
          if len(list((base/'結果/正解データ').glob('aia_truth_*.csv'))) != 21:
              raise RuntimeError('Expected 21 official preliminary truth files')
          manifest={}
          for path in paths:
              if not path.is_file(): raise FileNotFoundError(path)
              target=out/path
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,target)
              manifest[str(path)]=hashlib.sha256(path.read_bytes()).hexdigest()
          (out/'input_sha256.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Official public files:',len(paths))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aia-official-prelim-inputs-20261009
          path: aia-official-input-snapshot/
          retention-days: 1
          if-no-files-found: error
