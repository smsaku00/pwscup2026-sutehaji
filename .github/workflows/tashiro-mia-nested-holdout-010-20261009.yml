name: Tashiro MIA nested target heldout TPR010 method-transfer evaluation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tashiro-mia-nested-holdout-010-20261009.yml'
permissions:
  contents: write
jobs:
  evaluate_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXP: '攻撃フェーズ/Tashiro/MIA全体/experiments/20261009_TPR010到達と加工特徴転移検証'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis libraries
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Test holdout boundary and numerical invariants
        shell: bash
        run: |
          python -m unittest discover -s "$EXP" -p test_nested_holdout.py -v
      - name: Run nested public-feature target holdout and 72 fixed policies
        shell: bash
        run: |
          set -euo pipefail
          python "$EXP/run_nested_holdout.py" --root . --out "$RUNNER_TEMP/nested-mia"
      - name: Validate target independence, protocol and complete folds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pandas as pd
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nested-mia'
          a=pd.read_csv(p/'nested_target_holdout.csv')
          b=pd.read_csv(p/'policy_screen_72.csv')
          s=json.loads((p/'summary.json').read_text())
          prot=json.loads((p/'protocol.json').read_text())
          assert len(a)==17 and a.team.nunique()==17
          assert len(b)==72 and b[['scope','k','kind']].drop_duplicates().shape[0]==72
          assert prot['outer_target_label_used_for_training_or_hyperparameter_selection'] is False
          assert prot['method_panel_preselected_using_exposed_preliminary_truth'] is True
          assert (a.known_peer_count==16).all()
          assert s['baseline']['full_ge010']==2
          assert s['nested']['full_ge010']<=17
          assert (a.new_ge010*a.lost_ge010==0).all()
          print('PASS: 72 policies, 17 outer target holdout folds, independent target-score invariance')
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Publish only aggregated target results and protocol
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/nested-mia"
          mkdir -p "$EXP/nested_holdout"
          for x in nested_target_holdout.csv policy_screen_72.csv summary.json protocol.json; do
            test -s "$SRC/$x"
            cp "$SRC/$x" "$EXP/nested_holdout/$x"
          done
          (cd "$EXP/nested_holdout" && sha256sum nested_target_holdout.csv policy_screen_72.csv summary.json protocol.json > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EXP/nested_holdout"
          git diff --cached --quiet && exit 0
          git commit -m 'MIA全体：72方式から選ぶ二重チーム保留のTPR0.10結果を掲載'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
