<text x="54" y="300" font-family="sans-serif" font-size="17" fill="#333">163人方式</text>
<rect x="244" y="279" width="503" height="18" rx="4" fill="#dedede"/><rect x="244" y="303" width="302" height="18" rx="4" fill="#555555"/>
<text x="761" y="294" font-family="sans-serif" font-size="17" fill="#333">0.033534 元案</text><text x="560" y="321" font-family="sans-serif" font-size="17" fill="#222">0.020122 HCv2-1</text>
<path d="M52 364H908" stroke="#bbbbbb"/>
<text x="52" y="404" font-family="sans-serif" font-size="21" font-weight="700" fill="#222">別案 Zhang04-HCv2-3 と HCv2-1（新300組）</text>
