<text x="655" y="435" font-family="sans-serif" font-size="17" fill="#333">0.043087 Zhang04</text>
<text x="52" y="531" font-family="sans-serif" font-size="15" fill="#666">図中の棒は各段の相対値。300組比較の相手は元Zhang11ではない。</text>
<text x="52" y="559" font-family="sans-serif" font-size="15" fill="#666">ローカル自作パネルの結果であり、最終公式失点・本戦の因果効果ではない。</text>
